name: Bug report
description: Report incorrect behavior in the UDF or an example.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: observed
    attributes:
      label: What happened?
      description: Include the returned value, @error and @extended when available.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Provide a minimal AutoIt script or identify the example and exact steps.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: State Windows, AutoIt x86/x64, Acrobat/Reader version, and direct or Shell mode.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Attach screenshots if helpful. Do not attach confidential PDFs or personal data.
