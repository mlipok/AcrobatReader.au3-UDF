name: General question
description: Ask about integrating the UDF or using an example.
title: "[Question] "
labels: [question]
body:
  - type: textarea
    id: question
    attributes:
      label: What would you like to know?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context and what you have tried
      description: Include the relevant UDF function, example, and environment.
